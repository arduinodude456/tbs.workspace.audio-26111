<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - Öffentlicher Speicher von TBS Workspace</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .folder-info {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 25px;
            color: #111;
        }

        .file-box {
            background-color: #fafafa;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .file-name {
            font-weight: 600;
            font-size: 1.1rem;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .btn-download {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
        }

        hr {
            border: 0;
            border-top: 1px solid #eaeaea;
            margin: 30px 0;
        }

        .promo-box {
            font-size: 0.95rem;
        }

        .promo-box p {
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .btn-promo {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-promo:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="folder-info">Öffentlicher Speicher von TBS Workspace</div>
        <h1>Datei-Download</h1>

        <div class="file-box">
            <div class="file-name">lv_0_20260906094115.mp4</div>
            <!-- Das 'download' Attribut sorgt dafür, dass die Datei direkt heruntergeladen statt abgespielt wird -->
            <a href="audio.mp4" download="audio.mp4" class="btn-download">Datei herunterladen</a>
        </div>

        <hr>

        <div class="promo-box">
            <p>Du nutzt aktuell den öffentlichen Speicher.</p>
            <a href="https://arduinodude456.github.io/tbs.workspace" class="btn-promo" target="_blank">
                Entdecke TBS Workspace jetzt kostenlos &rarr;
            </a>
        </div>
    </div>

</body>
</html>
